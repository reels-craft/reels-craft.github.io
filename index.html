<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hassan Mohamed · Reels Craft</title>
<meta name="description" content="Hassan Mohamed — Reels Craft. Montage, motion graphics, and Arabic captions for social films. حسن محمد، مونتاج وموشن جرافيك.">
<meta property="og:title" content="Hassan Mohamed · Reels Craft">
<meta property="og:description" content="Montage, motion graphics, and social films.">
<meta property="og:image" content="assets/img/og.jpg">
<meta name="theme-color" content="#070a0f">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
/* Set language BEFORE first paint so there is no flash. */
(function () {
  var l = "en";
  try { l = localStorage.getItem("lang") || ((navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en"); } catch (e) {}
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
})();
</script>
</head>
<body>
<div id="splash"><img src="assets/img/logo-light.png" width="804" height="309" alt="Reels Craft"><i></i></div>
<a class="skip" href="#home" data-i18n="skip"></a>

<header class="bar">
  <a class="logo" href="#home" aria-label="Reels Craft"><img class="full" src="assets/img/logo-light.png" width="804" height="309" alt="Reels Craft"><img class="mk" src="assets/img/logo-mark.png" width="266" height="309" alt=""></a>
  <nav id="nav" aria-label="Main">
    <a href="#work" data-i18n="work"></a>
    <a href="#about" data-i18n="about"></a>
    <a href="#faq" data-i18n="faq"></a>
    <div id="cwrap">
      <button id="cbtn" type="button" aria-expanded="false" aria-controls="cmenu"><span data-i18n="contact"></span> <small aria-hidden="true">▾</small></button>
      <div id="cmenu" hidden></div>
    </div>
  </nav>
  <button id="lang" type="button"></button>
</header>

<main id="home">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="kicker"><i class="dot"></i><span id="studio"></span> — <span data-i18n="avail"></span></p>
        <h1 id="hname"></h1>
        <p class="role" id="role"></p>
        <p class="lead" data-i18n="hero_p"></p>
        <div class="row">
          <a class="btn solid" href="#work" data-i18n="see"></a>
          <a class="btn ghost" id="heroWa" href="#contact" data-i18n="hire"></a>
        </div>
        <p class="stat"><b id="statN" dir="ltr"></b> <span data-i18n="stat"></span></p>
      </div>
      <figure class="monitor">
        <video id="heroVid" poster="assets/img/intro-poster.jpg" loop playsinline preload="metadata">
          <source src="assets/videos/intro.mp4" type="video/mp4">
        </video>
        <span class="tc" id="heroTc" dir="ltr">00:00:00:00</span>
        <button id="sound" type="button" aria-pressed="false"></button>
        <button id="heroPlay" class="bigplay" type="button" hidden data-i18n="play"></button>
        <div class="scrub" id="scrub" dir="ltr"><i id="scrubBar"></i></div>
      </figure>
    </div>
  </section>

  <div class="mq" aria-hidden="true"><div class="mq-track" id="mq"></div></div>

  <section class="work" id="work" aria-roledescription="carousel">
    <h2 class="work-h" data-i18n="work_h"></h2>
    <div class="deck-wrap" dir="ltr">
      <div class="deck" id="deck"><!-- cards injected by js/app.js --></div>
      <button class="arrow l" id="prev" type="button" aria-label="Previous"></button>
      <button class="arrow r" id="next" type="button" aria-label="Next"></button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
  </section>

  <section class="band" id="about">
    <div class="wrap about">
      <figure class="portrait">
        <img src="assets/img/portrait.jpg" width="980" height="1225" alt="">
        <span class="mono" id="mono" aria-hidden="true">H</span>
      </figure>
      <div>
        <h2 data-i18n="about_h"></h2>
        <p class="lead" data-i18n="about_p1"></p>
        <p class="lead" data-i18n="about_p2"></p>
        <p class="tools-h" data-i18n="tools_h"></p>
        <ul class="tools" aria-label="Tools"></ul>
      </div>
    </div>
    <div class="wrap">
      <h3 data-i18n="svc_h"></h3>
      <ul class="svc" id="svc"></ul>
    </div>
  </section>

  <section class="band faq" id="faq">
    <div class="wrap">
      <h2 data-i18n="faq_h"></h2>
      <div id="faqList"></div>
    </div>
  </section>

  <section class="band contact" id="contact">
    <div class="wrap">
      <h2 data-i18n="contact_h"></h2>
      <p class="lead" data-i18n="contact_p"></p>
      <div id="links"></div>
    </div>
  </section>
</main>

<footer><img src="assets/img/logo-light.png" width="804" height="309" alt="Reels Craft" class="flogo"><span id="copy"></span></footer>

<!-- Player: video on one side, film information on the other -->
<div id="player" role="dialog" aria-modal="true" aria-label="Player" hidden>
  <div class="shell">
    <button class="x" id="close" type="button" aria-label="Close">✕</button>
    <div class="pl-media" id="plMedia">
      <video id="pv" playsinline preload="metadata"></video>
      <p class="pl-err" id="plErr" hidden></p>
      <button class="pl-big" id="plBig" type="button" aria-label="Play"></button>
      <div class="pl-bar">
        <input id="plSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" dir="ltr">
        <div class="pl-row" dir="ltr">
          <button id="plPlay" type="button"></button>
          <button id="plMute" type="button"></button>
          <span id="plTime">0:00 / --:--</span>
          <button id="plFs" type="button"></button>
        </div>
      </div>
    </div>
    <aside class="pl-info">
      <div class="meta" id="plMeta"></div>
      <h3 id="plTitle"></h3>
      <p class="lead" id="plBlurb"></p>
      <a class="btn solid" id="plWa" href="#contact" target="_blank" rel="noopener"></a>
      <div class="pl-nav">
        <button type="button" id="plBack"></button>
        <button type="button" id="plNext"></button>
      </div>
    </aside>
  </div>
</div>


<script src="data/site.js"></script>
<script src="data/projects.js"></script>
<script src="data/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
